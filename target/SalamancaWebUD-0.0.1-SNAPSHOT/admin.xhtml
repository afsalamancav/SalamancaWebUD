<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Panel Administrador</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    </h:head>
    <h:body>
        <div class="container mt-5">
            <h2 class="text-center mb-4">Aspirantes Registrados</h2>
            
            <h:dataTable value="#{aspiranteBean.listaEstudiantes}" var="est" 
                         class="table table-striped table-hover shadow">
                <h:column>
                    <f:facet name="header">Identificación</f:facet>
                    #{est.identificacion}
                </h:column>
                <h:column>
                    <f:facet name="header">Nombres</f:facet>
                    #{est.nombres} #{est.apellidos}
                </h:column>
                <h:column>
                    <f:facet name="header">Correo</f:facet>
                    #{est.correo}
                </h:column>
                <h:column>
                    <f:facet name="header">Programa</f:facet>
                    <span class="badge bg-info text-dark">#{est.programaInteres}</span>
                </h:column>
            </h:dataTable>

            <div class="mt-3">
                <h:link outcome="index" value="Volver al Registro" class="btn btn-secondary"/>
            </div>
            
            <footer class="mt-5 py-3 border-top text-center">
                <p>Angelo Felipe Salamanca Vargas | Grupo: [Tu Grupo] | 2026</p>
            </footer>
        </div>
    </h:body>
</html>
